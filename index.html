<style id="immersive-enhancement-css">
:root{--im-gold:#d5b977;--im-panel:rgba(12,10,13,.81)}
html{scroll-behavior:smooth}
body::after{content:"";pointer-events:none;position:fixed;inset:0;z-index:14;opacity:.42;background:radial-gradient(ellipse at 50% 43%,transparent 23%,rgba(0,0,0,.33) 88%),linear-gradient(to bottom,rgba(6,4,8,.2),transparent 21%,transparent 80%,rgba(5,4,9,.24));transition:opacity .8s ease}

#immersive-transition{position:fixed;inset:0;z-index:85;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,rgba(223,180,96,.16),rgba(9,5,13,.27) 42%,transparent 90%)}
#immersive-transition.pulse{animation:im-portal .85s cubic-bezier(.2,.7,.2,1)}
@keyframes im-portal{0%{opacity:0;transform:scale(.92)}24%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.09)}}
#im-dock{position:fixed;right:18px;bottom:74px;z-index:95;font-family:system-ui,Arial,sans-serif;color:#e9dac0;font-size:12px}
#im-dock *{box-sizing:border-box}
#im-toggle{display:flex;align-items:center;gap:9px;margin-left:auto;border:1px solid rgba(213,185,119,.4);border-radius:28px;padding:10px 15px;background:rgba(13,12,16,.86);backdrop-filter:blur(20px);box-shadow:0 10px 35px #0008;color:#e9d4a3;cursor:pointer;letter-spacing:.12em;font-size:10px}
#im-dock button:focus-visible,#im-dock select:focus-visible{outline:2px solid #d5b977;outline-offset:3px}
#im-settings{margin-top:10px;width:265px;padding:18px;background:var(--im-panel);border:1px solid rgba(213,185,119,.3);border-radius:17px;backdrop-filter:blur(24px);box-shadow:0 18px 55px #000b}
#im-settings[hidden]{display:none!important}
.im-heading{font:600 11px Georgia,serif;letter-spacing:.2em;color:#d5b977;margin:0 0 12px}
.im-description{font-size:11px;color:#b8a98c;line-height:1.5;margin:4px 0 12px}
.im-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #b8a06825}
.im-row label{font-size:11px;color:#ded0b3}
.im-row select{background:#151319;border:1px solid #b8a06855;color:#e9d4a3;padding:6px;border-radius:6px;font:inherit}
.im-action{border:1px solid #b8a06855;background:#b8a0681c;color:#ecd7a8;border-radius:7px;padding:7px 9px;cursor:pointer;font:inherit}
.im-action[aria-pressed="true"]{background:#b8a06855}

body.im-cinema #im-dock{opacity:.18;transition:opacity .6s ease}
